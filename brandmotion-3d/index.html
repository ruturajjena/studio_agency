<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrandMotion — Fractured Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #e8efff; --muted: #9fb3d9; --line: rgba(220, 232, 255, 0.18); }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; background: #040914; color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(16px, 4vw, 48px); pointer-events: none; }
      .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; letter-spacing: 0.02em; }
      .logo { font-weight: 600; letter-spacing: 0.04em; }
      .logo span { color: var(--muted); font-weight: 400; }
      .bottom { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end; }
      h1 { font-weight: 500; font-size: clamp(34px, 6vw, 84px); line-height: 0.95; letter-spacing: -0.035em; max-width: 12ch; }
      p { color: var(--muted); max-width: 34ch; font-size: 15px; line-height: 1.5; margin-top: 14px; }
      .cta { pointer-events: auto; border: 1px solid var(--line); background: rgba(8, 16, 34, 0.55); backdrop-filter: blur(10px);
             color: var(--ink); padding: 14px 26px; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; }
      .cta:hover { border-color: rgba(220, 232, 255, 0.5); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="bm-scene" aria-hidden="true"></canvas>
    <div class="ui">
      <div class="top"><div class="logo">BRAND<span>MOTION</span></div><div>Studio · 2026</div></div>
      <div class="bottom">
        <div>
          <h1>Brands, broken open to shine.</h1>
          <p>Identity, 3D and motion for companies that refuse to stand still.</p>
        </div>
        <a class="cta" href="#contact">Start a project →</a>
      </div>
    </div>
    <script type="module">
      import { createBrandMotionScene } from "./scene.js";
      createBrandMotionScene(document.getElementById("bm-scene"), {
        reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
      });
    </script>
  </body>
</html>
