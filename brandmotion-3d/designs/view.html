<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrandMotion Designs</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #e8efff; --muted: #9fb3d9; --line: rgba(220, 232, 255, 0.2); color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; background: #040914; color: var(--ink); font-family: "Sora", system-ui, sans-serif; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end;
             padding: clamp(16px, 4vw, 40px); pointer-events: none; background: linear-gradient(to top, rgba(4, 9, 20, 0.78), rgba(4, 9, 20, 0)); }
      .meta small { color: var(--muted); letter-spacing: 0.12em; font-size: 12px; }
      .meta h1 { font-weight: 500; font-size: clamp(26px, 4vw, 48px); letter-spacing: -0.03em; margin-top: 6px; }
      .meta p { color: var(--muted); max-width: 44ch; font-size: 14px; line-height: 1.5; margin-top: 6px; }
      nav { display: flex; gap: 8px; pointer-events: auto; }
      nav a, nav button { font: inherit; font-size: 14px; color: var(--ink); background: rgba(8, 16, 34, 0.55); backdrop-filter: blur(8px);
             border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer; text-decoration: none; }
      nav a:hover, nav button:hover, nav a:focus-visible, nav button:focus-visible { border-color: rgba(220, 232, 255, 0.6); outline: none; }
    </style>
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div class="hud">
      <div class="meta"><small id="num"></small><h1 id="name"></h1><p id="blurb"></p></div>
      <nav>
        <a href="./index.html">All designs</a>
        <button id="prev" type="button">←</button>
        <button id="next" type="button">→</button>
      </nav>
    </div>
    <script type="module">
      import { createStage } from "./stage.js";
      const TOTAL = 50;
      const pad = (n) => String(n).padStart(2, "0");
      let handle;
      async function show() {
        const n = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), TOTAL);
        const mod = await import(`./d${pad(n)}.js`);
        const d = mod.default;
        handle?.dispose();
        // Fresh canvas per design so each gets a clean WebGL context.
        const old = document.getElementById("stage");
        const canvas = old.cloneNode();
        old.replaceWith(canvas);
        handle = createStage(canvas, d, { reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches });
        document.getElementById("num").textContent = `${pad(n)} / ${TOTAL}`;
        document.getElementById("name").textContent = d.name;
        document.getElementById("blurb").textContent = d.blurb;
        document.title = `${d.name} · BrandMotion`;
      }
      const go = (step) => {
        const n = parseInt(location.hash.slice(1)) || 1;
        location.hash = pad(((n - 1 + step + TOTAL) % TOTAL) + 1);
      };
      document.getElementById("prev").onclick = () => go(-1);
      document.getElementById("next").onclick = () => go(1);
      addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
      addEventListener("hashchange", show);
      show();
    </script>
  </body>
</html>
